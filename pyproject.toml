[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "person-finder"
version = "1.0.0"
description = "AI-powered missing-person surveillance across multiple CCTV feeds (YOLOv8 + clothing colour + glasses + FaceNet)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "ultralytics>=8.0.0",
    "facenet-pytorch>=2.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
eval = ["matplotlib>=3.7.0", "scikit-learn>=1.3.0"]
dev = ["pytest>=7.4"]

[project.scripts]
person-finder = "person_finder.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
